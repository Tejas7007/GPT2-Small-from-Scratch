<text x="720" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#babbb5" font-weight="400" text-anchor="start">Synchronized replicas</text>
<path d="M 36 519 H 924" fill="none" stroke="#515650" stroke-width="1"/>
<text x="36" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#babbb5" font-weight="400" text-anchor="start">Training predictions are parallel</text>
<text x="924" y="555" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#babbb5" font-weight="400" text-anchor="end">Checkpoints are periodic</text>
