<text x="36" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#babbb5" font-weight="400" text-anchor="start">01</text>
<text x="36" y="445" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#eeebe5" font-weight="600" text-anchor="start">Causal forward</text>
