<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575" role="img" aria-labelledby="title desc">
<title id="title">One distributed next-token training update</title>
<desc id="desc">Example tokens show input and target sequences shifted by one position. Each position uses the current and earlier input tokens to predict the next token. Cross entropy scores these predictions against their targets. Four GPUs compute gradients on distinct batches, average them by all-reduce, and apply the same AdamW update. Training predictions are computed in parallel and checkpoints are saved periodically.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#989e97"/></marker></defs>
<rect width="960" height="575" fill="#1d2022"/>
<text x="36" y="57" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" fill="#eeebe5" font-weight="700" text-anchor="start">One training update</text>
<text x="36" y="100" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" fill="#babbb5" font-weight="400" text-anchor="start">Example tokens illustrate next-token training</text>
