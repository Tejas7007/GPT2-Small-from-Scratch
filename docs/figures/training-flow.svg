<text x="408" y="174" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" fill="#eeebe5" font-weight="400" text-anchor="middle">model</text>
<path d="M 408 204 V 232" fill="none" stroke="#989e97" stroke-width="1.5" marker-end="url(#arrow)"/>
