<text x="264" y="445" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#eeebe5" font-weight="600" text-anchor="start">Token loss</text>
<path d="M 264 457 H 450" fill="none" stroke="#515650" stroke-width="1"/>
<text x="264" y="489" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#babbb5" font-weight="400" text-anchor="start">Shifted targets</text>
<text x="492" y="411" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#babbb5" font-weight="400" text-anchor="start">03</text>
<text x="492" y="445" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#eeebe5" font-weight="600" text-anchor="start">Gradient all-reduce</text>
